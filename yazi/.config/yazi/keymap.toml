[mgr]
keymap = [
    # Essential controls
    { on = "<Esc>",    run = "escape --all",     desc = "Cancel modes and clear selection" },
    { on = "<F1>",    run = "help",             desc = "Open keymap help" },

    # Navigation
    { on = "<Enter>", run = "open",           desc = "Open selected file" },
    { on = "<Up>",    run = "arrow prev",     desc = "Move up, wrapping at the top" },
    { on = "<Down>",  run = "arrow next",     desc = "Move down, wrapping at the bottom" },
    { on = "<Left>",  run = "leave",          desc = "Go to parent" },
    { on = "<Right>", run = "enter",          desc = "Enter directory / open file" },
    { on = [ "g", "g" ], run = "arrow top",   desc = "Jump to top" },
    { on = "G",       run = "arrow bot",      desc = "Jump to bottom" },

    # Selection
    { on = "<Space>", run = "toggle",          desc = "Toggle selection" },
    { on = "v",       run = "visual_mode",     desc = "Enter visual mode" },
    { on = "V",       run = "toggle_all",      desc = "Select all" },

    # File operations
    { on = "y",       run = "yank",            desc = "Yank (copy)" },
    { on = "x",       run = "yank --cut",      desc = "Yank (cut)" },
    { on = "p",       run = "paste",           desc = "Paste" },
    { on = "d",       run = "remove",          desc = "Move to trash" },
    { on = "<S-d>",   run = "remove --permanently", desc = "Delete permanently" },
    { on = "r",       run = "rename --cursor=before_ext", desc = "Rename" },
    { on = "a",       run = "create",          desc = "Create file/dir" },
    { on = [ "c", "m" ], run = "plugin chmod", desc = "Chmod on selected files" },

    # View
    { on = ".",       run = "hidden toggle",   desc = "Toggle hidden files" },
    { on = "z",       run = "plugin zoxide",   desc = "Jump via zoxide" },
    { on = "/",       run = "find",            desc = "Find" },
    { on = "f",       run = "filter",          desc = "Filter files" },
    { on = "s",       run = "search --via=fd", desc = "Search with fd" },
    { on = "S",       run = "search --via=rg", desc = "Search with ripgrep" },

    # Shell
    { on = "!",       run = "shell --block",   desc = "Run shell command (block)" },
    { on = "e",       run = "open --interactive", desc = "Open with..." },

    # Tabs
    { on = "t",       run = "tab_create --current", desc = "New tab" },
    { on = "[",       run = "tab_switch -1 --relative", desc = "Prev tab" },
    { on = "]",       run = "tab_switch 1 --relative",  desc = "Next tab" },

    # Quit
    { on = "q",       run = "quit",             desc = "Quit" },
    { on = "Q",       run = "quit --no-cwd-file", desc = "Quit without saving cwd" },
]
