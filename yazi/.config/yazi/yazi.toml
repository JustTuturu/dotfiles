[mgr]
ratio          = [1, 4, 3]
sort_by        = "natural"
sort_sensitive = false
sort_reverse   = false
sort_dir_first = true
show_hidden    = true
show_symlink   = true

[preview]
tab_size   = 2
max_width  = 1200
max_height = 900

[opener]
edit = [
    { run = '/home/suzu/.local/bin/zed --wait %s', block = true, for = "linux", desc = "Edit (zed)" },
]
open = [
    { run = 'xdg-open %s1', desc = "Open", for = "linux" },
]

[open]
rules = [
    { mime = "text/*",          use = "edit" },
    { url  = "*.json",          use = "edit" },
    { url  = "*.jsonc",         use = "edit" },
    { url  = "*.yaml",          use = "edit" },
    { url  = "*.yml",           use = "edit" },
    { url  = "*.toml",          use = "edit" },
    { url  = "*.lua",           use = "edit" },
    { url  = "*.sh",            use = "edit" },
    { url  = "*.py",            use = "edit" },
    { url  = "*.js",            use = "edit" },
    { url  = "*.ts",            use = "edit" },
    { url  = "*.tsx",           use = "edit" },
    { url  = "*.css",           use = "edit" },
    { url  = "*.html",          use = "edit" },
    { url  = "*.xml",           use = "edit" },
    { url  = "*.lock",          use = "edit" },
    { url  = "*.conf",          use = "edit" },
    { mime = "image/*",         use = "open" },
    { mime = "video/*",         use = "open" },
    { mime = "application/pdf", use = "open" },
    { mime = "*",               use = "open" },
]
