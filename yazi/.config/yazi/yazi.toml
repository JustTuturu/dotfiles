[mgr]
ratio          = [1, 4, 3]
sort_by        = "natural"
sort_sensitive = false
sort_reverse   = false
sort_dir_first = true
show_hidden    = true
show_symlink   = true

[preview]
tab_size   = 2
max_width  = 1200
max_height = 900

[opener]
edit = [
    { run = '~/.local/bin/zed --wait %s', block = true, for = "linux", desc = "Edit (zed)" },
]
open = [
    { run = 'xdg-open %s1', desc = "Open (system default)", for = "linux" },
]
imv = [
    { run = 'imv %s', desc = "Image (imv)", orphan = true, for = "linux" },
]
mpv = [
    { run = 'mpv %s', desc = "Media (mpv)", orphan = true, for = "linux" },
]
blender = [
    { run = 'blender %s1', desc = "Blender", orphan = true, for = "linux" },
]
prismlauncher = [
    { run = 'prismlauncher --import %s1', desc = "Prism Launcher (import)", orphan = true, for = "linux" },
]

[open]
rules = [
    # ── 3D / Blender ───────────────────────────────────────────────────
    # Yazi strips the "x-" prefix from MIME types (application/x-tar → application/tar),
    # so extension globs are more reliable than MIME for 3D formats.
    { mime = "application/blender",   use = [ "blender", "open" ] },
    { url  = "*.blend",               use = [ "blender", "open" ] },
    { url  = "*.glb",                 use = [ "blender", "open" ] },
    { url  = "*.gltf",                use = [ "blender", "open" ] },
    { url  = "*.obj",                 use = [ "blender", "open" ] },
    { url  = "*.stl",                 use = [ "blender", "open" ] },
    { url  = "*.fbx",                 use = [ "blender", "open" ] },

    # ── Images / media ─────────────────────────────────────────────────
    { mime = "image/*",               use = [ "imv", "open" ] },        # imv has libRSVG → .svg works
    { mime = "video/*",               use = [ "mpv", "open" ] },
    { mime = "audio/*",               use = [ "mpv", "open" ] },

    # ── Modpacks ───────────────────────────────────────────────────────
    { url  = "*.mrpack",              use = [ "prismlauncher", "open" ] },

    # ── Text / code ────────────────────────────────────────────────────
    # Extension rules first: most code files are content-sniffed as text/plain,
    # so a broad text/* rule above them would swallow these before they are reached.
    { mime = "text/html",             use = "open" },                  # browser (matches mimeapps.list)
    { url  = "*.json",                use = "edit" },                  # application/json
    { url  = "*.jsonc",               use = "edit" },
    { url  = "*.yaml",                use = "edit" },                  # text/plain
    { url  = "*.yml",                 use = "edit" },
    { url  = "*.toml",                use = "edit" },                  # text/plain
    { url  = "*.ts",                  use = "edit" },                   # text/plain, not video/mp2t
    { url  = "*.tsx",                 use = "edit" },
    { url  = "*.xml",                 use = "edit" },
    { url  = "*.lock",                use = "edit" },
    { mime = "text/*",                use = "edit" },                  # .md .py .sh .js .lua .css .conf …

    # ── Archives ───────────────────────────────────────────────────────
    # Names as Yazi reports them (x- stripped) — these are verified with `spot` (Tab).
    { mime = "application/zip",             use = "extract" },
    { mime = "application/gzip",            use = "extract" },
    { mime = "application/tar",             use = "extract" },
    { mime = "application/bzip2",           use = "extract" },
    { mime = "application/xz",              use = "extract" },
    { mime = "application/7z-compressed",   use = "extract" },
    { mime = "application/rar",             use = "extract" },

    # ── Fallback ───────────────────────────────────────────────────────
    { mime = "*",                     use = "open" },
]
