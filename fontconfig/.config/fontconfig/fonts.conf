<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
    <dir>~/.local/share/fonts</dir>
    <dir prefix="xdg">fonts</dir>
    <dir>/home/linuxbrew/.linuxbrew/share/fonts</dir>

    <!-- Sans (UI): Inter; CJK fallback Zen Kaku Gothic New -->
    <match target="pattern">
        <test name="family" qual="any">
            <string>sans-serif</string>
        </test>
        <edit name="family" mode="prepend" binding="strong">
            <string>Inter</string>
            <string>Zen Kaku Gothic New</string>
        </edit>
    </match>

    <!-- Serif (reading): Literata; CJK fallback LXGW WenKai Mono -->
    <match target="pattern">
        <test name="family" qual="any">
            <string>serif</string>
        </test>
        <edit name="family" mode="prepend" binding="strong">
            <string>Literata</string>
            <string>LXGW WenKai Mono</string>
        </edit>
    </match>

    <!-- Monospace (code): JetBrains Mono; CJK fallback LXGW WenKai Mono -->
    <match target="pattern">
        <test name="family" qual="any">
            <string>monospace</string>
        </test>
        <edit name="family" mode="prepend" binding="strong">
            <string>JetBrains Mono</string>
            <string>LXGW WenKai Mono</string>
        </edit>
    </match>

    <alias>
        <family>system-ui</family>
        <prefer>
            <family>sans-serif</family>
        </prefer>
    </alias>

    <alias>
        <family>ui-monospace</family>
        <default>
            <family>monospace</family>
        </default>
    </alias>

    <alias>
        <family>-apple-system</family>
        <prefer>
            <family>sans-serif</family>
        </prefer>
    </alias>

    <alias>
        <family>BlinkMacSystemFont</family>
        <prefer>
            <family>sans-serif</family>
        </prefer>
    </alias>
</fontconfig>
