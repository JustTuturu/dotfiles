# Noctalia v5 config
# Lives in ~/.config/noctalia/config.toml (copied from dotfiles)
# Load order: defaults -> this file -> ~/.local/state/noctalia/settings.toml (GUI, wins)

# ---------------------------------------------------------------------------
# Global shell appearance
# ---------------------------------------------------------------------------
[shell]
corner_radius_scale = 1.0
button_borders = true
input_borders = true
popup_borders = true
card_borders = true
popup_shadows = true

font_family = "Inter"
time_format = "{:%H:%M}"
date_format = "%A, %x"

avatar_path = "~/wallpapers/Chisa.jpg"

# ---------------------------------------------------------------------------
# Clipboard (Noctalia's built-in manager)
# ---------------------------------------------------------------------------
clipboard_enabled = true
clipboard_history_max_entries = 20
clipboard_keep_from_closed_apps = false
clipboard_auto_paste = "auto"

# ---------------------------------------------------------------------------
# Laucher
# ---------------------------------------------------------------------------
[shell.launcher]
categories = false
layout = "simple"

# ---------------------------------------------------------------------------
# Shadow
# ---------------------------------------------------------------------------
[shell.shadow]
direction = "down_right"
alpha = 0.55

# ---------------------------------------------------------------------------
# Animations
# ---------------------------------------------------------------------------
[shell.animation]
enabled = true
speed = 1.0

# ---------------------------------------------------------------------------
# Panels
# ---------------------------------------------------------------------------
[shell.panel]
transparency_mode = "glass"
control_center_placement = "floating"
control_center_position = "auto"
launcher_placement = "floating"

# ---------------------------------------------------------------------------
# Noctalia Greeter — keep the login screen synced (wallpaper, palette, font)
# ---------------------------------------------------------------------------
[shell.greeter_sync]
auto_sync = true

# ---------------------------------------------------------------------------
# Theme / palette
# ---------------------------------------------------------------------------
[theme]
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-tonal-spot"
pure_black_dark = false

# ---------------------------------------------------------------------------
# Location & weather
# ---------------------------------------------------------------------------
[location]
auto_locate = true

[weather]
enabled = true
effects = false
unit = "metric"

# ---------------------------------------------------------------------------
# Wallpaper
# ---------------------------------------------------------------------------
[wallpaper]
enabled = true
directory = "~/wallpapers"
fill_mode = "crop"
transition_duration = 1500
transition_on_startup = false

[wallpaper.monitors.DP-2]
path = "~/wallpapers/Chisa.jpg"

[wallpaper.monitors.HDMI-A-1]
path = "~/wallpapers/Chisa.jpg"

# ---------------------------------------------------------------------------
# Bars
# ---------------------------------------------------------------------------
[bar]
order = ["main"]

[bar.main]
position = "right"
enabled = true
auto_hide = false
smart_auto_hide = true
reserve_space = false
layer = "top"

thickness = 64

background_opacity = 0.0
border = "outline"
border_width = 0.0
shadow = false
radius = 12

margin_ends = 16
margin_edge = 16
padding = 2
widget_spacing = 3

font_weight = 500
font_family = "Inter"
scale = 1.2
font_scale = 0.85

hover_highlight = true

capsule = true
capsule_fill = "surface_variant"
capsule_thickness = 0.82
capsule_opacity = 0.9

start = []
center = [
    "tray",
    "active_window",
    "tailscale",
    "volume",
    "notifications",
    "clock",
]
end = []

[bar.main.monitor.hdmi]
match = "HDMI-A-1"
enabled = false

[widget.active_window]
type = "active_window"
min_length = 60
max_length = 160
icon_size = 16
title_scroll = "on_hover"

[widget.clock]
type = "clock"
format = "{:%H:%M}"
vertical_format = "{:%H:%M}"
tooltip_format = "{:%A, %B %d, %Y}"
scale = 1.0

[widget.launcher]
type = "launcher"

[widget.notifications]
type = "notifications"
hide_when_no_unread = true

[widget.tray]
type = "tray"
pinned = ["Unikey", "Keyboard - English (US)", "steam", "Discord"]

[widget.volume]
type = "volume"

[dock]
enabled = false
position = "bottom"
show_running = true
magnification = true
magnification_scale = 1.5
background_opacity = 0.88
radius = 16
border = "outline"
border_width = 0.0
shadow = true
auto_hide = false
smart_auto_hide = false
reserve_space = true
active_opacity = 1.0
inactive_opacity = 0.85
active_scale = 1.0
inactive_scale = 0.85
icon_size = 48

[notification]
background_opacity = 1.0
position = "bottom_right"
monitors = ["DP-2"]

[osd]
enabled = true
position = "bottom_right"
monitors = ["DP-2"]

[idle]
pre_action_fade_seconds = 2.0

[idle.behavior.lock]
action = "lock"
enabled = false
timeout = 600.0

[idle.behavior.screen-off]
action = "screen_off"
enabled = false

[idle.behavior.lock-and-suspend]
action = "lock_and_suspend"
enabled = false

[lockscreen]
enabled = false

[system.monitor]
enabled = false

[desktop_widgets]
enabled = false

# ---------------------------------------------------------------------------
# Hooks — keep matugen as the single source of truth for the palette
# ---------------------------------------------------------------------------
[hooks]
wallpaper_changed = '$HOME/.config/matugen/scripts/wallpaper-hook.sh'
