# --- UV config file ---
python-preference = "only-managed"
python-downloads = "automatic"

resolution = "highest"
prerelease = "if-necessary"

# --- Caching ---
no-cache = false

compile-bytecode = true

# --- Installs ---
link-mode = "clone"

# --- Pip interface (uv pip options only) ---
[pip]
system = false
generate-hashes = false
require-hashes = false
