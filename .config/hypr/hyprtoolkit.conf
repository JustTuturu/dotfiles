# Palette for hyprtoolkit apps (hyprpolkitagent).
# Colors are generated from the current wallpaper by matugen and sourced here,
# so this file only holds the non-color settings.
source = ~/.config/hypr/generated/hyprtoolkit-colors.conf

rounding_large = 12
rounding_small = 6
font_family = Inter
font_size = 12
